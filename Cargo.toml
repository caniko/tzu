[workspace]
members = [
  "crates/tzu-acp",
  "crates/tzu-cli",
  "crates/tzu-config",
  "crates/tzu-core",
  "crates/tzu-gui",
  "crates/tzu-repo",
  "crates/tzu-runner",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
repository = "https://codeberg.org/caniko/tzu"
readme = "README.md"

[workspace.metadata.crane]
name = "tzu"

[workspace.dependencies]
anyhow = "1"
any_spawner = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
console_error_panic_hook = "0.1"
http-body-util = "0.1"
content_inspector = "0.2"
ignore = "0.4"
leptos = "0.8.19"
leptos_axum = "0.8.9"
leptos_meta = "0.8.6"
leptos_router = "0.8.12"
lucide-leptos = { version = "2", default-features = false, features = [
  "arrows",
  "development",
  "multimedia",
  "notifications",
  "shapes",
] }
petgraph = { version = "0.6", features = ["serde-1"] }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "any",
  "postgres",
  "runtime-tokio",
  "sqlite",
  "tls-rustls",
] }
tempfile = "3"
thespis = { version = "0.2", features = ["derive"] }
thespis_impl = "0.3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v5"] }
wasm-bindgen = "=0.2.121"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
