[[pages.sections]]
type = "hero"
title = "tzu"
tagline = "Turn a goal into a plan you can inspect"
subtitle = "tzu is a local-first planning harness that persists an immutable problem spec for each goal, validates and scores deterministic candidate plans, and runs the selected plan's task graph through an ACP agent session."

[[pages.sections.ctas]]
label = "View source"
href = "https://codeberg.org/caniko/tzu"
primary = true

[[pages.sections.ctas]]
label = "Get started"
href = "#install"

[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Spec before plans"
description = "Every goal becomes a persisted problem specification first, so the input stays fixed and readable while candidate plans are generated and scored."

[[pages.sections.features]]
title = "Inspectable frontier"
description = "Deterministic plan sketches are validated, scored and capped, then kept as a frontier you can query for discard reasons and score buckets."

[[pages.sections.features]]
title = "Task graph to run report"
description = "The selected plan becomes an ordered task graph with explicit dependencies, and each run writes machine-readable status and results into project state."

[[pages.sections.features]]
title = "ACP instead of transcripts"
description = "Codex, DeepSeek, OpenCode and Hermes adapters speak ACP over stdio JSON-RPC, so tzu never parses CLI output and never stores adapter credentials."

[[pages.sections]]
type = "workflow_steps"
id = "workflow"
heading = "Plan a goal, then execute it"
intro = "Use the CLI or MCP server to keep planning decisions inspectable from the first problem specification through the final run report."

[[pages.sections.steps]]
title = "Initialize project state"
description = "tzu init creates the local state needed for planning and execution."

[[pages.sections.steps]]
title = "Create a plan"
description = "tzu plan \"organize a research workshop\" builds and persists a selected plan plus its harness metadata."

[[pages.sections.steps]]
title = "Inspect the frontier"
description = "tzu inspect shows retained candidates, discard reasons, score buckets, and descriptor cells."

[[pages.sections.steps]]
title = "Run and review"
description = "tzu run inspect-repo executes a task, while tzu status reports the selected plan, tasks, and run results."

[[pages.sections]]
type = "install"
id = "install"
heading = "Build it, then plan"
intro = "The workspace builds with Cargo or inside the Nix dev shell; the CLI binary is named tzu."
guide_href = "https://codeberg.org/caniko/tzu#installation"

