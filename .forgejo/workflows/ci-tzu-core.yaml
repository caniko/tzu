# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test -p tzu-core

      - name: Check MSRV
        run: nix develop -c cargo check -p tzu-core --all-targets

      - name: Clippy
        run: nix develop -c cargo clippy -p tzu-core --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p tzu-core --allow-dirty
